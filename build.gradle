plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.20'
    id 'java'
}

group = "com.github.xSasakiHaise"
version = "2.0.1"

base {
    archivesName = "hellascontrol"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    // optional, aber kann helfen falls irgendwas repo-mäßig hakt:
    maven { url = 'https://maven.neoforged.net/releases' }
}

dependencies {
    // NeoForge 1.21.1
    implementation "net.neoforged:neoforge:21.1.65"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "hellascontrol"
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(
                "Specification-Title": "HellasControl",
                "Specification-Vendor": "xSasaki_Haise",
                "Specification-Version": "1",
                "Implementation-Title": "HellasControl",
                "Implementation-Version": project.version,
                "Implementation-Vendor": "xSasaki_Haise"
        )
    }
}
